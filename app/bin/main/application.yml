server:
  port: 8080

spring:
  application:
    name: ingestion-service
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/ingestion}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

ingestion:
  aws:
    region: ${AWS_REGION:us-east-2}
  sqs:
    queueUrl: ${SQS_QUEUE_URL:}
    maxMessages: 5
    waitTimeSeconds: 20
    visibilityTimeoutSeconds: 900
    concurrency: 4
  s3:
    # no extra config needed beyond region/credentials
    readBufferBytes: 65536
  parser:
    delimiter: "|"
    hasHeader: true
    batchSize: 2000
    charset: UTF-8
